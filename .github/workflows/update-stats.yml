name: Update dashboard stats

on:
  schedule:
    # Times are UTC and do not shift for DST. As written these hit
    # 6am/8am/12pm/3pm/6pm Mountain during MDT (UTC-6); during MST
    # (UTC-7, roughly Nov-Mar) they'll run an hour early local time.
    - cron: "0 12 * * *" # 6am MDT
    - cron: "0 14 * * *" # 8am MDT
    - cron: "0 18 * * *" # 12pm MDT
    - cron: "0 21 * * *" # 3pm MDT
    - cron: "0 0 * * *" # 6pm MDT
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Fetch latest stats from MongoDB and Clerk
        working-directory: scripts
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: npm run fetch-stats

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stats.json public/data/insights.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update dashboard stats"
          git push
