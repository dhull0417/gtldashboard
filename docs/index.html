<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GroupThat Leadership Dashboard</title>
  <link rel="icon" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="gate">
    <div class="gate-card">
      <img src="assets/logo.jpg" alt="GroupThat" />
      <div style="color: var(--text-secondary); font-size: 14px;">Enter password to view the dashboard</div>
      <input type="password" id="gate-password" autocomplete="current-password" />
      <button id="gate-submit" type="button">Enter</button>
      <div class="gate-error" id="gate-error"></div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="site-header">
      <img class="logo" src="assets/logo.jpg" alt="GroupThat" />
      <span class="title">Leadership Dashboard</span>
    </header>

    <main>
      <div class="range-row" id="range-row" role="group" aria-label="Time range">
        <button data-range="1d" type="button">1D</button>
        <button data-range="7d" type="button">7D</button>
        <button data-range="30d" type="button">30D</button>
        <button data-range="3m" type="button">3M</button>
        <button data-range="1y" type="button">1Y</button>
        <button data-range="all" type="button">All</button>
      </div>

      <div class="chart-grid">
        <section class="chart-card" data-metric="users">
          <div class="chart-head">
            <span class="chart-title">New users</span>
            <span class="chart-total" data-total></span>
          </div>
          <div class="chart-wrap">
            <svg data-chart></svg>
            <div class="tooltip" data-tooltip><strong data-tooltip-value></strong><br /><span data-tooltip-date></span></div>
          </div>
        </section>

        <section class="chart-card" data-metric="groups">
          <div class="chart-head">
            <span class="chart-title">New groups</span>
            <span class="chart-total" data-total></span>
          </div>
          <div class="chart-wrap">
            <svg data-chart></svg>
            <div class="tooltip" data-tooltip><strong data-tooltip-value></strong><br /><span data-tooltip-date></span></div>
          </div>
        </section>

        <section class="chart-card" data-metric="meetups">
          <div class="chart-head">
            <span class="chart-title">New meetups</span>
            <span class="chart-total" data-total></span>
          </div>
          <div class="chart-wrap">
            <svg data-chart></svg>
            <div class="tooltip" data-tooltip><strong data-tooltip-value></strong><br /><span data-tooltip-date></span></div>
          </div>
        </section>
      </div>

      <button class="table-toggle" id="table-toggle" type="button">View as table</button>
      <div id="table-view" hidden>
        <table>
          <thead>
            <tr><th>Date</th><th>New users</th><th>New groups</th><th>New meetups</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
